name: Probe RC Charts coverage

# One-off diagnostic. Read-only: discovers which chart segments the Charts API
# supports so we know whether ASA keyword revenue can come from aggregates
# instead of walking every customer record. Safe to delete once answered.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe Charts API
        env:
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
          REVENUECAT_PROJECT_ID: ${{ secrets.REVENUECAT_PROJECT_ID }}
        run: python probe_rc_charts2.py
