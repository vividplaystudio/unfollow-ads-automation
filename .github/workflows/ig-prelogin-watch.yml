# Watches the one screen every new user reaches before they pay.
#
# The check runs ON THE SERVER, not here: Instagram throttles datacenter
# addresses, so a runner sees 429 on every way and learns nothing. This job only
# presses the button and reports what came back. The server messages Telegram
# itself when the screen is really down.
name: Instagram prelogin watch

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

concurrency:
  group: ig-prelogin-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the server to check the username screen
        env:
          SECRET: ${{ secrets.RC_WEBHOOK_SECRET }}
          URL: ${{ secrets.IG_PRELOGIN_CHECK_URL }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then
            echo "IG_PRELOGIN_CHECK_URL or RC_WEBHOOK_SECRET not set — nothing to call"
            exit 0
          fi
          body=$(curl -sS --max-time 90 -H "Authorization: $SECRET" "$URL")
          echo "$body"
          verdict=$(printf '%s' "$body" | python3 -c "import json,sys; print(json.load(sys.stdin).get('verdict','?'))" 2>/dev/null || echo "?")
          case "$verdict" in
            up)      echo "the username screen works" ;;
            unknown) echo "the server was rate-limited — no signal either way, staying quiet" ;;
            down)    echo "the username screen is DOWN — the server has sent the alert"; exit 1 ;;
            *)       echo "could not read a verdict from the server"; exit 1 ;;
          esac
