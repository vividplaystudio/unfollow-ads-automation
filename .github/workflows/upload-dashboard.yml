name: Upload Dashboard HTML/CSS/JS

on:
  workflow_dispatch:
  push:
    paths:
      - "dashboard/**"

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A syntax error in any endpoint would break it live (the RevenueCat
      # webhook, health reports), so refuse to upload PHP that doesn't parse.
      - name: Check PHP syntax
        run: |
          for f in dashboard/*.php; do php -l "$f" || exit 1; done

      - name: Upload dashboard files via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
          RC_WEBHOOK_SECRET: ${{ secrets.RC_WEBHOOK_SECRET }}
          IG_ALERT_EMAIL: ${{ secrets.IG_ALERT_EMAIL }}
          IG_ALERT_TELEGRAM_BOT_TOKEN: ${{ secrets.IG_ALERT_TELEGRAM_BOT_TOKEN }}
          IG_ALERT_TELEGRAM_CHAT_ID: ${{ secrets.IG_ALERT_TELEGRAM_CHAT_ID }}
        run: |
          python3 << 'EOF'
          import ftplib, ssl, os, io, json, time
          host = os.environ["FTP_HOST"]
          user = os.environ["FTP_USER"]
          pw = os.environ["FTP_PASS"]
          path = os.environ["FTP_PATH"]
          rc_secret = os.environ.get("RC_WEBHOOK_SECRET", "").strip()

          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          # Retry the CONNECT. Two consecutive runs died on
          # "TimeoutError: timed out" inside socket.connect — the host was
          # refusing the connection outright, not failing mid-transfer. cPanel
          # brute-force protection throttles repeated FTP connections from the
          # same source, and this repo opens one per data job as well as per
          # dashboard push. A stale page then sits on the server looking like a
          # broken fix, so failing loudly on the first refusal is worse than
          # waiting.
          ftp = None
          for attempt in range(4):
              try:
                  ftp = ftplib.FTP_TLS(host, timeout=90, context=ctx)
                  ftp.login(user, pw)
                  ftp.prot_p()
                  break
              except Exception as e:
                  print(f"FTP connect attempt {attempt + 1}/4 failed: {e}")
                  if attempt == 3:
                      raise
                  time.sleep(20 * (attempt + 1))

          # Navigate / create path
          try:
              ftp.cwd(path)
          except ftplib.error_perm:
              parts = path.strip("/").split("/")
              current = ""
              for part in parts:
                  current = f"{current}/{part}" if current else f"/{part}"
                  try:
                      ftp.cwd(current)
                  except:
                      try:
                          ftp.mkd(current)
                          ftp.cwd(current)
                      except Exception as e:
                          print(f"Failed to create {current}: {e}")

          # Upload all files from dashboard/
          for fname in sorted(os.listdir("dashboard")):
              local = f"dashboard/{fname}"
              if os.path.isfile(local):
                  with open(local, "rb") as f:
                      print(f"Uploading {fname}...")
                      ftp.storbinary(f"STOR {fname}", f)

          # Write the RC webhook shared secret to disk as .rc_webhook_secret
          # so rc_webhook.php / rc_events.php can authenticate incoming calls.
          # Only write if we have a secret (no-op if the GH secret is unset).
          if rc_secret:
              buf = io.BytesIO(rc_secret.encode("utf-8"))
              print("Uploading .rc_webhook_secret...")
              ftp.storbinary("STOR .rc_webhook_secret", buf)
          else:
              print("RC_WEBHOOK_SECRET not set — skipping secret file upload")

          # Alert channels for the Instagram health panel. Written only when at
          # least one IG_ALERT_* secret is set; otherwise alerts show on the panel only.
          alert_cfg = {
              "email_to": os.environ.get("IG_ALERT_EMAIL", "").strip(),
              "telegram_bot_token": os.environ.get("IG_ALERT_TELEGRAM_BOT_TOKEN", "").strip(),
              "telegram_chat_id": os.environ.get("IG_ALERT_TELEGRAM_CHAT_ID", "").strip(),
          }
          if any(alert_cfg.values()):
              print("Uploading .ig_health_config.json...")
              ftp.storbinary("STOR .ig_health_config.json", io.BytesIO(json.dumps(alert_cfg).encode("utf-8")))
          else:
              print("No IG_ALERT_* secrets set — health alerts will show on the panel only")

          ftp.quit()
          print("All dashboard files uploaded")
          EOF
