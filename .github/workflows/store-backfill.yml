name: Store Backfill

# One-shot: build the SQLite fact store from scratch and ship it to cPanel.
#
# Exists so the migration needs no shell access on the host. Everything the
# backfill reads is reachable over HTTP or an API, so it can run here just as
# well as there -- and the result is a single file we upload.
#
# Safe to re-run: every writer in store.py is idempotent by primary key, and
# the workflow always starts from whatever store.db is already on cPanel, so
# a second run tops up rather than duplicating.

on:
  workflow_dispatch:
    inputs:
      ad_lookback_days:
        description: "Days of ad spend history to load"
        default: "90"
      attr_batch:
        description: "Max attribution lookups this run (0 to skip the customer walk entirely)"
        default: "40000"
      fresh:
        description: "Ignore the existing store on cPanel and rebuild from empty"
        type: boolean
        default: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download the existing store from cPanel
        if: ${{ !inputs.fresh }}
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          python3 - <<'PY'
          import ftplib, ssl, os
          ctx = ssl.create_default_context()
          ctx.check_hostname = False; ctx.verify_mode = ssl.CERT_NONE
          # The FTP account is chroot'd to the dashboard folder itself
          # (/home/coinvohy/genivox.com/ads-upload), so an OS-absolute path
          # never resolves over FTP and we cannot know in advance how much of
          # the prefix the chroot swallows. Rather than guess, try the full
          # path and then each shorter suffix until one works:
          #   /home/coinvohy/genivox.com/ads-upload/unfollow-ads   (no chroot)
          #   /genivox.com/ads-upload/unfollow-ads                 (chroot at ~)
          #   /ads-upload/unfollow-ads                             (chroot at site)
          #   /unfollow-ads                                        (actual)
          # This is correct for every chroot depth instead of only one, and it
          # never CREATES a directory -- silently creating the wrong folder is
          # how the scripts ended up somewhere cron does not look.
          def navigate(ftp, path="/home/coinvohy/genivox.com/ads-upload/unfollow-ads"):
              parts = path.strip("/").split("/")
              last_err = None
              for i in range(len(parts)):
                  candidate = "/" + "/".join(parts[i:])
                  try:
                      ftp.cwd(candidate)
                      return ftp.pwd()
                  except ftplib.error_perm as e:
                      last_err = e
                      continue
              raise RuntimeError(
                  f"could not reach {path} over FTP at any chroot depth: {last_err}"
              )

          try:
                  go(path)
              except ftplib.error_perm:
                  go(re.sub(r"^/home/[^/]+", "", path) or "/")
              return ftp.pwd()

          try:
              ftp = ftplib.FTP_TLS(os.environ["FTP_HOST"], timeout=60, context=ctx)
              ftp.login(os.environ["FTP_USER"], os.environ["FTP_PASS"]); ftp.prot_p()
              print(f"  working dir: {navigate(ftp)}")
              with open("store.db", "wb") as fh:
                  ftp.retrbinary("RETR store.db", fh.write)
              print(f"  downloaded existing store ({os.path.getsize('store.db'):,} bytes)")
              ftp.quit()
          except Exception as e:
              # No store yet is the normal first-run case, not a failure.
              print(f"  no existing store to resume from ({type(e).__name__}: {e}) — starting fresh")
              if os.path.exists("store.db") and os.path.getsize("store.db") == 0:
                  os.remove("store.db")
          PY

      # The PHP endpoint only serves the LIVE rc_events.jsonl. The rotated
      # .archive files hold everything older -- ~40 MB back to early July at
      # the time of writing -- so a backfill that used HTTP would quietly load
      # nine days instead of two months and look like it had succeeded.
      # Pulling them over the FTP credentials we already have avoids both the
      # endpoint's limits and the dashboard folder's basic auth.
      - name: Download webhook archives
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          mkdir -p rc_logs
          python3 - <<'PY'
          import ftplib, ssl, os
          ctx = ssl.create_default_context()
          ctx.check_hostname = False; ctx.verify_mode = ssl.CERT_NONE
          ftp = ftplib.FTP_TLS(os.environ["FTP_HOST"], timeout=300, context=ctx)
          ftp.login(os.environ["FTP_USER"], os.environ["FTP_PASS"]); ftp.prot_p()
          # The webhook logs live at the dashboard folder, which is FTP root
          # here; walk up from the deepest form so this also works unchrooted.
          for cand in ("/home/coinvohy/genivox.com/ads-upload",
                       "/genivox.com/ads-upload", "/ads-upload", "/"):
              try:
                  ftp.cwd(cand); break
              except ftplib.error_perm:
                  continue
          print(f"  webhook logs dir: {ftp.pwd()}")
          names = [n for n in ftp.nlst()
                   if n.endswith(".jsonl.archive") or n == "rc_events.jsonl"]
          total = 0
          for n in sorted(names):
              local = os.path.join("rc_logs", os.path.basename(n))
              with open(local, "wb") as fh:
                  ftp.retrbinary(f"RETR {n}", fh.write)
              size = os.path.getsize(local)
              total += size
              print(f"    {os.path.basename(n):48} {size:>12,} bytes")
          print(f"  {len(names)} files, {total:,} bytes total")
          ftp.quit()
          PY

      - name: Ingest webhook events
        env:
          STORE_PATH: ${{ github.workspace }}/store.db
          # Set so ingest_rc reads the downloaded archives from disk, oldest
          # first, instead of falling back to the live-file-only HTTP path.
          LOCAL_OUTPUT_DIR: ${{ github.workspace }}/rc_logs
          RC_WEBHOOK_SECRET: ${{ secrets.RC_WEBHOOK_SECRET }}
          RC_EVENTS_URL: https://genivox.com/ads-upload/rc_events.php
        run: python3 -u ingest_rc.py

      - name: Ingest Apple Ads history
        env:
          STORE_PATH: ${{ github.workspace }}/store.db
          AD_LOOKBACK_DAYS: ${{ inputs.ad_lookback_days }}
          ASA_CLIENT_ID: ${{ secrets.ASA_CLIENT_ID }}
          ASA_TEAM_ID: ${{ secrets.ASA_TEAM_ID }}
          ASA_KEY_ID: ${{ secrets.ASA_KEY_ID }}
          ASA_PRIVATE_KEY_PEM: ${{ secrets.ASA_PRIVATE_KEY_PEM }}
          ASA_ORG_ID: ${{ secrets.ASA_ORG_ID }}
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
          REVENUECAT_PROJECT_ID: ${{ secrets.REVENUECAT_PROJECT_ID }}
        run: python3 -u ingest_ads.py

      - name: Reconcile customers
        if: ${{ inputs.attr_batch != '0' }}
        env:
          STORE_PATH: ${{ github.workspace }}/store.db
          ATTR_BATCH: ${{ inputs.attr_batch }}
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
          REVENUECAT_PROJECT_ID: ${{ secrets.REVENUECAT_PROJECT_ID }}
        run: python3 -u ingest_customers.py

      - name: Checkpoint and summarise
        env:
          STORE_PATH: ${{ github.workspace }}/store.db
        run: |
          python3 - <<'PY'
          import os, store
          conn = store.open_store()
          st = store.store_stats(conn)
          # Must checkpoint before upload: in WAL mode the newest writes sit in
          # store.db-wal, so uploading store.db alone would ship a stale file.
          store.checkpoint_and_close(conn)
          for k, v in st.items():
              print(f"  {k:26} {v}")
          print(f"  {'db size':26} {os.path.getsize(os.environ['STORE_PATH']):,} bytes")
          PY

      - name: Upload the store to cPanel
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          python3 - <<'PY'
          import ftplib, ssl, os
          ctx = ssl.create_default_context()
          ctx.check_hostname = False; ctx.verify_mode = ssl.CERT_NONE
          # The FTP account is chroot'd to the dashboard folder itself
          # (/home/coinvohy/genivox.com/ads-upload), so an OS-absolute path
          # never resolves over FTP and we cannot know in advance how much of
          # the prefix the chroot swallows. Rather than guess, try the full
          # path and then each shorter suffix until one works:
          #   /home/coinvohy/genivox.com/ads-upload/unfollow-ads   (no chroot)
          #   /genivox.com/ads-upload/unfollow-ads                 (chroot at ~)
          #   /ads-upload/unfollow-ads                             (chroot at site)
          #   /unfollow-ads                                        (actual)
          # This is correct for every chroot depth instead of only one, and it
          # never CREATES a directory -- silently creating the wrong folder is
          # how the scripts ended up somewhere cron does not look.
          def navigate(ftp, path="/home/coinvohy/genivox.com/ads-upload/unfollow-ads"):
              parts = path.strip("/").split("/")
              last_err = None
              for i in range(len(parts)):
                  candidate = "/" + "/".join(parts[i:])
                  try:
                      ftp.cwd(candidate)
                      return ftp.pwd()
                  except ftplib.error_perm as e:
                      last_err = e
                      continue
              raise RuntimeError(
                  f"could not reach {path} over FTP at any chroot depth: {last_err}"
              )

          try:
                  go(path)
              except ftplib.error_perm:
                  go(re.sub(r"^/home/[^/]+", "", path) or "/")
              return ftp.pwd()

          ftp = ftplib.FTP_TLS(os.environ["FTP_HOST"], timeout=120, context=ctx)
          ftp.login(os.environ["FTP_USER"], os.environ["FTP_PASS"]); ftp.prot_p()
          print(f"  working dir: {navigate(ftp)}")
          # Upload to a temp name then rename, so a cron tick that fires
          # mid-transfer never opens a half-written database.
          with open("store.db", "rb") as fh:
              ftp.storbinary("STOR store.db.new", fh)
          try:
              ftp.delete("store.db")
          except Exception:
              pass
          ftp.rename("store.db.new", "store.db")
          # Stale WAL/SHM siblings would shadow the uploaded file's contents.
          for junk in ("store.db-wal", "store.db-shm"):
              try: ftp.delete(junk)
              except Exception: pass
          print(f"  uploaded store.db ({os.path.getsize('store.db'):,} bytes)")
          ftp.quit()
          PY
